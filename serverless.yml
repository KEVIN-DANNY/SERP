service: serp-cloud-platform

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: production
    JWT_SECRET: serp_cloud_secret_key_2026_super_secure_jwt_token
    DYNAMODB_EVENTS_TABLE: serp-events-${self:provider.stage}
    DYNAMODB_REGISTRATIONS_TABLE: serp-registrations-${self:provider.stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/serp-*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
          Resource: "arn:aws:sqs:${self:provider.region}:*:serp-*"
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: "*"

functions:
  api:
    handler: backend/src/lambda.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'
