name: SERP Cloud CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Test Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Verify Backend Server & Health Check
        run: |
          cd backend
          node src/db.js
          echo "Database migrations and seeding verified!"

      # Test Frontend
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
